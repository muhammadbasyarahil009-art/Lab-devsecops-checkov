name: "IaC Security Scan dengan Checkov"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Terraform
        id: checkov-terraform
        continue-on-error: true
        run: |
          checkov -d terraform --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-terraform.sarif

      - name: Upload SARIF ke GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov-terraform.sarif') != ''
        with:
          sarif_file: checkov-terraform.sarif
          category: "checkov-terraform"

      - name: Block pipeline jika ditemukan pelanggaran di Terraform
        if: steps.checkov-terraform.outcome == 'failure'
        run: |
          echo "Checkov menemukan pelanggaran keamanan pada Terraform!"
          echo "Periksa log job atau tab Security -> Code scanning."
          exit 1

      - name: Report sukses
        if: steps.checkov-terraform.outcome == 'success'
        run: |
          echo "Seluruh pemeriksaan Checkov pada Terraform PASSED!"
